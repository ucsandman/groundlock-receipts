name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Test launcher
        run: python -m unittest discover -s tests

      - name: Test workspaces
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Launcher smoke
        run: python launch.py --skip-install --skip-build --skip-tests --no-browser --exit-after-ready --port 3010

      - name: Build Docker image
        run: docker build --tag groundlock-web:ci .

      - name: Smoke Docker image
        shell: bash
        run: |
          docker run --rm -d --name groundlock-web-ci -p 3014:3000 groundlock-web:ci
          for attempt in {1..60}; do
            if node -e "fetch('http://127.0.0.1:3014/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              docker stop groundlock-web-ci
              exit 0
            fi
            sleep 1
          done
          docker logs groundlock-web-ci || true
          docker stop groundlock-web-ci || true
          exit 1
