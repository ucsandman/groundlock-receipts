name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Test launcher
        run: python -m unittest discover -s tests

      - name: Test workspaces
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Launcher smoke
        run: python launch.py --skip-install --skip-build --skip-tests --no-browser --exit-after-ready --port 3010

      - name: Build Docker image
        run: docker build --build-arg NEXT_PUBLIC_SITE_URL=https://receipts.groundlock.dev --tag groundlock-web:ci .

      - name: Smoke Docker image
        shell: bash
        run: |
          docker run --rm -d --name groundlock-web-ci -p 3014:3000 groundlock-web:ci
          trap 'docker stop groundlock-web-ci || true' EXIT
          ready=0
          for attempt in {1..60}; do
            if node -e "fetch('http://127.0.0.1:3014/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            docker logs groundlock-web-ci || true
            exit 1
          fi
          node scripts/smoke_web_response.mjs http://127.0.0.1:3014 \
            --verify-file-text 'Dear Jane Roe, your account AC-40192 shows a balance of $1,500.00, due by June 1, 2026. Thank you.'

      - name: Smoke Docker live mode
        shell: bash
        run: |
          STATUS_RECORDS='[{"version":"groundlock-status/v1","kind":"key","subject":{"signerDomain":"publisher.example","kid":"k1"},"status":"active","issuedAt":"2026-06-08T00:00:00.000Z"},{"version":"groundlock-status/v1","kind":"claim","subject":{"receiptHash":"sha256:abc123"},"status":"active","issuedAt":"2026-06-08T00:00:00.000Z"}]'
          docker run --rm -d --name groundlock-web-live-ci -p 3015:3000 \
            -e GROUNDLOCK_SIGNER_DOMAIN=publisher.example \
            -e NEXT_PUBLIC_SITE_URL=https://receipts.groundlock.dev \
            -e GROUNDLOCK_DOH_ENDPOINT=https://cloudflare-dns.com/dns-query \
            -e GROUNDLOCK_STATUS_BASE_URL=https://receipts.groundlock.dev/groundlock/status \
            -e GROUNDLOCK_FETCH_TIMEOUT_MS=5000 \
            -e GROUNDLOCK_RATE_LIMIT_MAX=240 \
            -e GROUNDLOCK_RATE_LIMIT_WINDOW_MS=60000 \
            -e "GROUNDLOCK_STATUS_RECORDS_JSON=${STATUS_RECORDS}" \
            groundlock-web:ci
          trap 'docker stop groundlock-web-live-ci || true' EXIT
          ready=0
          for attempt in {1..60}; do
            if node -e "fetch('http://127.0.0.1:3015/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            docker logs groundlock-web-live-ci || true
            exit 1
          fi
          node scripts/smoke_web_response.mjs http://127.0.0.1:3015 \
            --expect-live \
            --expected-origin https://receipts.groundlock.dev \
            --status-key-lookup key:publisher.example:k1 \
            --status-claim-lookup claim:sha256:abc123
